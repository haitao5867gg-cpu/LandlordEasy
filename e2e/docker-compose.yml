services:
  mysql:
    image: ${E2E_MYSQL_IMAGE:-docker.m.daocloud.io/library/mysql:8.0}
    environment:
      MYSQL_ROOT_PASSWORD: e2e_root
      MYSQL_DATABASE: landlord_easy_e2e
      MYSQL_USER: e2e
      MYSQL_PASSWORD: e2e
    ports:
      - '${E2E_MYSQL_PORT:-3307}:3306'
    command: >-
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ue2e', '-pe2e']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    tmpfs:
      - /var/lib/mysql
