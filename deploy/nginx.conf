# LandlordEasy production Nginx configuration
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/landlord-easy
# Validate before reload: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name landlordeasy.cn www.landlordeasy.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # WeChat Official Account domain ownership verification must remain
    # directly accessible over both HTTP and HTTPS.
    location = /MP_verify_tCFBQGJoGkbFKWSO.txt {
        alias /var/www/wechat-verification/MP_verify_tCFBQGJoGkbFKWSO.txt;
        default_type text/plain;
    }

    location / {
        return 301 https://landlordeasy.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name landlordeasy.cn www.landlordeasy.cn;

    ssl_certificate /etc/letsencrypt/live/landlordeasy.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/landlordeasy.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /MP_verify_tCFBQGJoGkbFKWSO.txt {
        alias /var/www/wechat-verification/MP_verify_tCFBQGJoGkbFKWSO.txt;
        default_type text/plain;
    }

    location = /tenant {
        return 301 /tenant/;
    }

    location /tenant/ {
        alias /opt/landlord-easy/apps/tenant-h5/dist/;
        index index.html;
        try_files $uri $uri/ /tenant/index.html;
    }

    # index.html 本身不能被缓存,否则部署新版本后微信内置浏览器等激进缓存的
    # 客户端会继续用旧 index.html,而它引用的旧 hash 文件名早被下一次构建
    # (vite 默认清空 dist)删除,导致页面卡死/表现为运行的还是老代码
    # (2026-08-31 M18真实支付测试时踩过,租客反复被带回登录页就是这个原因)。
    # 带 hash 文件名的静态资源本身不受影响,文件名一变必然是新内容,可以放心
    # 长期缓存,不需要额外配置。
    location = /tenant/index.html {
        alias /opt/landlord-easy/apps/tenant-h5/dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SEC-001: regex locations match Nginx's decoded/normalized URI.
    # Keep before any other regex and do NOT use ^~ on /uploads/.
    # Block all contract-prefixed entries, including nested/case variants.
    location ~* ^/uploads/(.*/)?contract- {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location /uploads/ {
        disable_symlinks on;
        autoindex off;
        alias /opt/landlord-easy/data/uploads/;
    }

    location / {
        root /opt/landlord-easy/apps/landlord-h5/dist;
        try_files $uri $uri/ /index.html;
    }

    # 同上,landlord-h5 的 index.html 也不能被缓存,原因和处理方式一致。
    location = /index.html {
        root /opt/landlord-easy/apps/landlord-h5/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# --- dev 环境(M10 环境隔离,独立后端进程3001端口、独立静态目录、独立数据库
# landlordeasy_dev)。下面两个 server 块是 certbot --nginx 自动生成/改写过的
# 真实服务器内容(结构比较奇怪是 certbot 的风格,不是手写出来的,保持跟服务器
# 完全一致,不要手动"整理"成跟上面 prod 一样的写法,除非同时在服务器上也改) ---
server {
    server_name dev.landlordeasy.cn;

    location = /tenant {
        return 301 /tenant/;
    }

    location /tenant/ {
        alias /var/www/landlordeasy/tenant-h5-dev/;
        index index.html;
        try_files $uri $uri/ /tenant/index.html;
    }

    location = /tenant/index.html {
        alias /var/www/landlordeasy/tenant-h5-dev/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # dev环境一直漏配了这条(2026-09-01 M19真实浏览器验证"查看/下载合同"链接
    # 时才第一次暴露出来: /uploads/ 请求命中了下面的SPA兜底location,返回的是
    # index.html 不是真实文件,之前的功能从没在dev环境真正测过uploads链路)
    # SEC-001: regex locations match Nginx's decoded/normalized URI.
    # Keep before any other regex and do NOT use ^~ on /uploads/.
    # Block all contract-prefixed entries, including nested/case variants.
    location ~* ^/uploads/(.*/)?contract- {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location /uploads/ {
        disable_symlinks on;
        autoindex off;
        alias /opt/landlord-easy-dev/data/uploads/;
    }

    location / {
        root /var/www/landlordeasy/landlord-h5-dev;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        root /var/www/landlordeasy/landlord-h5-dev;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dev.landlordeasy.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dev.landlordeasy.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = dev.landlordeasy.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name dev.landlordeasy.cn;
    return 404; # managed by Certbot


}